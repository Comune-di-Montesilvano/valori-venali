version: 2
# Giro settimanale di lunedì: patch/minor auto-mergiate da
# dependabot-automerge.yml, major lasciate aperte. publish-latest.yml
# (martedì) ripubblica :latest con quanto mergiato.
# NB: cooldown accetta solo default-days per questi ecosistemi
# (semver-major-days invalida il file → Dependabot non parte).
updates:
  # Base image app (PHP+Apache), stage Node per gli asset, MariaDB dev
  - package-ecosystem: docker
    directories:
      - "/docker/php"
      - "/docker/db"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  # MariaDB usata in produzione
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # MariaDB: restiamo sulla 11 (= 11.8 LTS, EOL 2030-02, più lunga della
    # 12.3 LTS). Le major nuove sono spesso rolling: si valutano a mano.
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  # Bootstrap Italia (asset self-hosted)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
