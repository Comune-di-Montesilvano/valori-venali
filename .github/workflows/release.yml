name: Build & Push Container

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versione da pubblicare (es. v2.1.0)'
        required: false
        default: 'latest'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set lowercase image owner + version
        env:
          OWNER: ${{ github.repository_owner }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          OWNER_CLEAN=$(echo "$OWNER" | tr -d '"')
          IMAGE_OWNER=$(echo "$OWNER_CLEAN" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_OWNER=$IMAGE_OWNER" >> $GITHUB_ENV

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${DISPATCH_TAG:-latest}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_REVISION=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "APP_IS_TAG=true" >> $GITHUB_ENV
          echo "GITHUB_URL=https://github.com/${{ github.repository }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push immagine
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.APP_REVISION }}
            APP_IS_TAG=${{ env.APP_IS_TAG }}
            GITHUB_URL=${{ env.GITHUB_URL }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ env.APP_VERSION }}
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ github.sha }}

      # Scan immagine pubblicata — report-only, risultati su tab Security.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: latest
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ env.APP_VERSION }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image.sarif
