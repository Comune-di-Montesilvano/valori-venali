name: Build & Push Container

# Unica via verso GHCR. :latest cambia solo per:
#   - nuovo tag vX.Y.Z (creato solo dal maintainer) → vX.Y.Z + latest;
#   - rebuild giornaliero su causa reale (.github/scripts/rebuild-check.sh):
#     nuovi merge Dependabot dopo l'ultimo tag, patch Debian, CVE HIGH/CRITICAL
#     con fix → latest + latest-YYYYMMDD (rollback). Lavoro umano non taggato
#     non entra MAI in latest.
# Pipeline: build → push solo per digest → Trivy bloccante → SBOM + attestazioni
# + firma cosign → smoke test sul digest → solo allora i tag.
on:
  push:
    tags: [ "v*" ]
  # 04:30 UTC: dopo il giro Dependabot delle 01:00 e i relativi auto-merge
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      rebuild_latest:
        description: "Rebuild forzato di latest (stesso target del giornaliero), senza controllo cause"
        type: boolean
        default: true
      dry_run:
        description: "Solo il controllo cause: stampa l'esito, nessun rebuild"
        type: boolean
        default: false

# Mai cancel-in-progress: un push a ghcr interrotto a metà può lasciare un
# manifest incompleto — run concorrenti si accodano.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/comune-di-montesilvano/valori-venali
  TRIVY_VERSION: v0.76.1

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      # Issue "bump Dependabot in attesa di tag"
      issues: write
    outputs:
      # Dry run: sempre skip. Dispatch forzato: mai skip. Altrimenti decide il controllo cause.
      skip: ${{ steps.mode.outputs.skip == 'true' && 'true' || steps.mode.outputs.force == 'true' && 'false' || steps.check.outputs.skip || 'false' }}
      source: ${{ steps.mode.outputs.source || steps.check.outputs.target }}
      version: ${{ steps.mode.outputs.version || steps.check.outputs.version }}
      tags: ${{ steps.mode.outputs.tags }}
      reason: ${{ steps.mode.outputs.reason || steps.check.outputs.reason }}
      cause_c: ${{ steps.check.outputs.cause_c || 'false' }}
      pkg_refresh: ${{ steps.mode.outputs.pkg_refresh }}
    steps:
      # Traffico in uscita limitato agli host elencati. Release fallita per
      # "blocked" → host nel log del post-step harden-runner: aggiungerlo qui
      # se legittimo.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            get.trivy.dev:443
            check.trivy.dev:443
            mirror.gcr.io:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            deb.debian.org:80
            deb.debian.org:443

      # Storia + tag completi: target di latest e controllo cause.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Modalità di build
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REBUILD_LATEST: ${{ inputs.rebuild_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          skip=false check=false force=false
          echo "pkg_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            tags="$IMAGE:$REF_NAME"
            # latest solo se è il tag più alto (un hotfix su una linea vecchia no)
            highest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
            if [[ "$REF_NAME" == "$highest" ]]; then tags="$tags,$IMAGE:latest"; fi
            {
              echo "source=$GITHUB_SHA"
              echo "version=$REF_NAME"
              echo "reason=tag $REF_NAME"
              echo "tags=$tags"
            } >> "$GITHUB_OUTPUT"
          else
            check=true
            if [[ "$DRY_RUN" == true ]]; then
              skip=true
            elif [[ "$EVENT_NAME" == workflow_dispatch && "$REBUILD_LATEST" == true ]]; then
              force=true
              echo "reason=rebuild manuale (workflow_dispatch)" >> "$GITHUB_OUTPUT"
            fi
            echo "tags=$IMAGE:latest,$IMAGE:latest-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.mode.outputs.check == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.mode.outputs.check == 'true'
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Controllo cause
        id: check
        if: steps.mode.outputs.check == 'true'
        env:
          MAIN_REF: origin/master
        run: bash .github/scripts/rebuild-check.sh

      - name: Issue bump Dependabot in attesa di tag
        if: steps.mode.outputs.check == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PENDING: ${{ steps.check.outputs.pending_deps }}
          TITLE: "Aggiornamenti Dependabot in attesa di tag"
        run: |
          set -euo pipefail
          existing=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [[ "$PENDING" == 0 ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" -R "$REPO" --comment "Nessun bump Dependabot in attesa: chiusa da \`release.yml\`."
            fi
            exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/master)
          list=$(git log --first-parent --format='- %h %s (%an)' "$last_tag..origin/master")
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "$PENDING commit Dependabot su master sono dopo lavoro non rilasciato: \`latest\` non li prende finché non si crea un nuovo tag \`v*\`." \
            "Commit dopo \`$last_tag\`:" \
            "$list")
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi

  build-push:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # SARIF Trivy nella tab Security
      security-events: write
      # Firma keyless cosign e attestazioni (identità OIDC del workflow)
      id-token: write
      attestations: write
      # Issue "vulnerabilità non risolvibile con un rebuild"
      issues: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            deb.debian.org:80
            deb.debian.org:443
            get.trivy.dev:443
            check.trivy.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      # Sorgente = tag, oppure target di latest (tag + soli commit Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push solo per digest, senza tag: un'immagine che non passa Trivy o lo
      # smoke resta un digest orfano (rimosso da ghcr-cleanup.yml).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          pull: true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ needs.setup.outputs.source }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            valori-venali.rebuild.reason=${{ needs.setup.outputs.reason }}
          build-args: |
            APP_VERSION=${{ needs.setup.outputs.version }}
            APP_REVISION=${{ needs.setup.outputs.source }}
            APP_IS_TAG=${{ github.ref_type == 'tag' }}
            GITHUB_URL=https://github.com/${{ github.repository }}
            PKG_REFRESH=${{ needs.setup.outputs.pkg_refresh }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Bloccante sempre: CRITICAL/HIGH con fix fermano la pubblicazione.
      - name: Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      # Rebuild partito per CVE con fix ma ancora bloccato: il fix non è ancora
      # nell'immagine base. latest resta il precedente; la issue tiene traccia
      # finché Dependabot non porta il fix.
      - name: Issue vulnerabilità non risolvibile con un rebuild
        if: failure() && steps.trivy.outcome == 'failure' && needs.setup.outputs.cause_c == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Vulnerabilità non risolvibile con un rebuild"
          table=$(trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --format table "$IMAGE@$DIGEST" 2>&1 || true)
          body=$(printf '%s\n' \
            "Il rebuild di \`latest\` è partito per CVE HIGH/CRITICAL con fix, ma l'immagine ricostruita ha ancora vulnerabilità bloccanti: il fix non è ancora nell'immagine base. \`latest\` è rimasto quello precedente." \
            "" "Run: $RUN_URL" "" '```' "$table" '```' "" \
            "Si risolve con il bump Dependabot dell'immagine base; il controllo giornaliero riprova da solo.")
          existing=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi

      - name: SBOM (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      # Attestazioni firmate (Sigstore) registrate su GitHub, legate al digest.
      # Verifica: .github/scripts/verify-image.sh <tag>
      - name: Attestazione provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Attestazione SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Firma keyless del digest (non del tag, che è mobile).
      - name: Firma immagine (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Upload Trivy results
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # App + MariaDB avviate con il digest appena firmato: se fallisce nessun tag
  # si sposta e latest resta il precedente.
  smoke:
    needs: [ setup, build-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      # Script da questo commit (i tag vecchi possono non averlo), dati
      # (initdb, compose) dalla sorgente dell'immagine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source }}
          persist-credentials: false
          path: src

      - name: Smoke test
        working-directory: src
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          docker pull -q "$IMAGE@$DIGEST"
          "$GITHUB_WORKSPACE/ci/.github/scripts/smoke-test.sh" "$IMAGE@$DIGEST"

      - name: Log app (se smoke test fallisce)
        if: failure()
        run: cat src/smoke-app.log || true

  # Solo ora l'immagine diventa raggiungibile per tag (indice copiato così
  # com'è, attestazioni comprese).
  publish:
    needs: [ setup, build-push, smoke ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      # Niente setup-buildx: imagetools lavora solo sul registry, basta il
      # buildx del runner (setup-buildx scaricherebbe BuildKit da Docker Hub).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica tag
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
          TAGS: ${{ needs.setup.outputs.tags }}
          VERSION: ${{ needs.setup.outputs.version }}
          REASON: ${{ needs.setup.outputs.reason }}
        run: |
          set -euo pipefail
          args=()
          IFS=, read -ra tags <<<"$TAGS"
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          [ "${#args[@]}" -gt 0 ] || { echo "::error::Nessun tag da pubblicare"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          {
            echo "### Pubblicato \`$VERSION\`"
            echo
            echo "\`$IMAGE@$DIGEST\` → ${TAGS//,/ }"
            echo
            echo "Motivo: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"
