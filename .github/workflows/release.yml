name: Build & Push Container

# Unica via verso GHCR. :latest cambia solo per:
#   - nuovo tag vX.Y.Z (creato solo dal maintainer) → vX.Y.Z + latest;
#   - rebuild giornaliero su causa reale (.github/scripts/rebuild-check.sh):
#     nuovi merge Dependabot dopo l'ultimo tag, patch Debian, CVE HIGH/CRITICAL
#     con fix → latest + latest-YYYYMMDD (rollback). Lavoro umano non taggato
#     non entra MAI in latest.
# Pipeline: build → push solo per digest → Trivy (tag: bloccante; rebuild:
# nessuna regressione rispetto a latest) → SBOM + attestazioni
# + firma cosign → smoke test sul digest → solo allora i tag.
on:
  push:
    tags: [ "v*" ]
  # 04:30 UTC: dopo il giro Dependabot delle 01:00 e i relativi auto-merge
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      rebuild_latest:
        description: "Rebuild forzato di latest (stesso target del giornaliero), senza controllo cause"
        type: boolean
        default: true
      dry_run:
        description: "Solo il controllo cause: stampa l'esito, nessun rebuild"
        type: boolean
        default: false

# Mai cancel-in-progress: un push a ghcr interrotto a metà può lasciare un
# manifest incompleto — run concorrenti si accodano.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/comune-di-montesilvano/valori-venali
  TRIVY_VERSION: v0.76.1

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      # Issue "bump Dependabot in attesa di tag"
      issues: write
    outputs:
      # Dry run: sempre skip. Dispatch forzato: mai skip. Altrimenti decide il controllo cause.
      skip: ${{ steps.mode.outputs.skip == 'true' && 'true' || steps.mode.outputs.force == 'true' && 'false' || steps.check.outputs.skip || 'false' }}
      source: ${{ steps.mode.outputs.source || steps.check.outputs.target }}
      version: ${{ steps.mode.outputs.version || steps.check.outputs.version }}
      tags: ${{ steps.mode.outputs.tags }}
      reason: ${{ steps.mode.outputs.reason || steps.check.outputs.reason }}
      pkg_refresh: ${{ steps.mode.outputs.pkg_refresh }}
    steps:
      # Traffico in uscita limitato agli host elencati. Release fallita per
      # "blocked" → host nel log del post-step harden-runner: aggiungerlo qui
      # se legittimo.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            get.trivy.dev:443
            check.trivy.dev:443
            mirror.gcr.io:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            deb.debian.org:80
            deb.debian.org:443

      # Storia + tag completi: target di latest e controllo cause.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Ogni tag deve avere le sue note per gli utenti in CHANGELOG.md (criterio
      # OpenSSF release_notes): controllo qui, prima di costruire o pubblicare
      # qualsiasi cosa. Se manca: cancellare il tag, aggiungere la sezione, ritaggare.
      - name: Note di rilascio nel CHANGELOG
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/release-notes.sh "$REF_NAME" > /dev/null

      - name: Modalità di build
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REBUILD_LATEST: ${{ inputs.rebuild_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          skip=false check=false force=false
          echo "pkg_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            tags="$IMAGE:$REF_NAME"
            # latest solo se è il tag più alto (un hotfix su una linea vecchia no)
            highest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
            if [[ "$REF_NAME" == "$highest" ]]; then tags="$tags,$IMAGE:latest"; fi
            {
              echo "source=$GITHUB_SHA"
              echo "version=$REF_NAME"
              echo "reason=tag $REF_NAME"
              echo "tags=$tags"
            } >> "$GITHUB_OUTPUT"
          else
            check=true
            if [[ "$DRY_RUN" == true ]]; then
              skip=true
            elif [[ "$EVENT_NAME" == workflow_dispatch && "$REBUILD_LATEST" == true ]]; then
              force=true
              echo "reason=rebuild manuale (workflow_dispatch)" >> "$GITHUB_OUTPUT"
            fi
            echo "tags=$IMAGE:latest,$IMAGE:latest-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.mode.outputs.check == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.mode.outputs.check == 'true'
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Controllo cause
        id: check
        if: steps.mode.outputs.check == 'true'
        env:
          MAIN_REF: origin/master
        run: bash .github/scripts/rebuild-check.sh

      - name: Issue bump Dependabot in attesa di tag
        if: steps.mode.outputs.check == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PENDING: ${{ steps.check.outputs.pending_deps }}
          TITLE: "Aggiornamenti Dependabot in attesa di tag"
        run: |
          set -euo pipefail
          existing=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [[ "$PENDING" == 0 ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" -R "$REPO" --comment "Nessun bump Dependabot in attesa: chiusa da \`release.yml\`."
            fi
            exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/master)
          list=$(git log --first-parent --format='- %h %s (%an)' "$last_tag..origin/master")
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "$PENDING commit Dependabot su master sono dopo lavoro non rilasciato: \`latest\` non li prende finché non si crea un nuovo tag \`v*\`." \
            "Commit dopo \`$last_tag\`:" \
            "$list")
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi

  build-push:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # SARIF Trivy nella tab Security
      security-events: write
      # Firma keyless cosign e attestazioni (identità OIDC del workflow)
      id-token: write
      attestations: write
      # Issue "vulnerabilità non risolvibile con un rebuild"
      issues: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      publish: ${{ steps.nonreg.outputs.publish || 'true' }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            deb.debian.org:80
            deb.debian.org:443
            get.trivy.dev:443
            check.trivy.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Sorgente = tag, oppure target di latest (tag + soli commit Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push solo per digest, senza tag: un'immagine che non passa Trivy o lo
      # smoke resta un digest orfano (rimosso da ghcr-cleanup.yml).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          pull: true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ needs.setup.outputs.source }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            valori-venali.rebuild.reason=${{ needs.setup.outputs.reason }}
          build-args: |
            APP_VERSION=${{ needs.setup.outputs.version }}
            APP_REVISION=${{ needs.setup.outputs.source }}
            APP_IS_TAG=${{ github.ref_type == 'tag' }}
            GITHUB_URL=https://github.com/${{ github.repository }}
            PKG_REFRESH=${{ needs.setup.outputs.pkg_refresh }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Tag vX.Y.Z: bloccante assoluto, CRITICAL/HIGH con fix fermano la pubblicazione.
      # Rebuild di latest: gate di non regressione (step successivo). Bloccare in
      # assoluto qui fermerebbe anche il rebuild che corregge altre CVE, per una CVE
      # che nessun rebuild può correggere (fix non ancora nell'immagine base).
      # DB scaricato ora, non dalla cache giornaliera (cache-trivy-YYYY-MM-DD) che
      # Trivy tiene per buona fino a NextUpdate: può non conoscere fix che
      # rebuild-check (DB fresco) ha già visto come causa c. Visto il 2026-11-03.
      - name: Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "false"
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: ${{ github.ref_type == 'tag' && '1' || '0' }}
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      # Rebuild: si pubblica solo se l'immagine nuova non ha CVE HIGH/CRITICAL con
      # fix assenti dalla latest attuale (stesso pacchetto + stesso ID). Stesso
      # binario e stesso DB (fresco, vedi step precedente) per entrambe le immagini.
      # Senza latest leggibile la base è vuota: ogni CVE conta (fallire chiusi).
      - name: Trivy non regressione rispetto a latest (rebuild)
        id: nonreg
        if: github.ref_type != 'tag'
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          DIGEST: ${{ steps.build.outputs.digest }}
          REASON: ${{ needs.setup.outputs.reason }}
        run: |
          set -euo pipefail
          opts=(image --quiet --skip-db-update --scanners vuln --severity "CRITICAL,HIGH"
            --ignore-unfixed --ignorefile .trivyignore --format json)
          keys='[.Results[]?.Vulnerabilities[]? | "\(.PkgName) \(.VulnerabilityID)"] | unique'
          trivy "${opts[@]}" --output "$RUNNER_TEMP/head.json" "$IMAGE@$DIGEST"
          if docker pull --quiet "$IMAGE:latest" >/dev/null 2>&1; then
            trivy "${opts[@]}" --output "$RUNNER_TEMP/base.json" "$IMAGE:latest"
          else
            echo "::warning::$IMAGE:latest non leggibile: confronto con base vuota"
            echo '{}' > "$RUNNER_TEMP/base.json"
          fi
          jq -r "$keys | .[]" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/head.txt"
          jq -r "$keys | .[]" "$RUNNER_TEMP/base.json" > "$RUNNER_TEMP/base.txt"
          residual=$(wc -l < "$RUNNER_TEMP/head.txt")
          echo "residual=$([ "$residual" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          nuove=$(comm -23 "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt")
          corrette=$(comm -13 "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt" | wc -l)
          echo "Non regressione: nuova $residual, latest $(wc -l < "$RUNNER_TEMP/base.txt"), corrette $corrette"
          if [[ -n "$nuove" ]]; then
            printf '%s\n' "$nuove"
            echo "::error::$(printf '%s\n' "$nuove" | wc -l) vulnerabilità HIGH/CRITICAL con fix nuove rispetto a latest"
            exit 1
          fi
          # Rebuild per la sola causa c (CVE con fix su latest) che non ne corregge
          # nessuna: ripubblicare darebbe ogni giorno la stessa latest con un digest nuovo.
          if [[ "$REASON" == c:* && "$corrette" -eq 0 ]]; then
            echo "::notice::Rebuild per CVE con fix, ma nessuna corretta: latest invariata"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Una sola issue: aperta/commentata se la pubblicazione è fermata (tag o
      # regressione) o se la latest pubblicata ha ancora CVE con fix (fix non ancora
      # nell'immagine base); chiusa dal primo rebuild pulito.
      - name: Issue vulnerabilità non risolvibile con un rebuild
        if: >-
          always() && steps.build.outcome == 'success'
          && (steps.trivy.outcome == 'failure' || steps.nonreg.outcome != 'skipped')
        # Solo residui (latest pubblicata comunque): un errore di gh non deve fermare la pubblicazione.
        continue-on-error: ${{ steps.trivy.outcome != 'failure' && steps.nonreg.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FERMATA: ${{ steps.trivy.outcome == 'failure' || steps.nonreg.outcome == 'failure' }}
          RESIDUAL: ${{ steps.nonreg.outputs.residual }}
        run: |
          set -euo pipefail
          TITLE="Vulnerabilità non risolvibile con un rebuild"
          existing=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [[ "$FERMATA" != "true" && "$RESIDUAL" != "true" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" -R "$REPO" --comment "Rebuild senza CVE HIGH/CRITICAL con fix: chiusa da \`release.yml\` ($RUN_URL)."
            fi
            exit 0
          fi
          if [[ "$FERMATA" == "true" ]]; then
            esito="La pubblicazione è stata fermata: è un tag di versione, oppure l'immagine ricostruita ha CVE HIGH/CRITICAL con fix che la \`latest\` pubblicata non aveva (regressione). Resta pubblicata l'immagine precedente."
          else
            esito="La nuova \`latest\` è stata pubblicata (nessuna regressione), ma contiene ancora CVE HIGH/CRITICAL con fix: il fix non è ancora nell'immagine base."
          fi
          table=$(trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore --format table "$IMAGE@$DIGEST" 2>&1 || true)
          body=$(printf '%s\n' \
            "$esito" \
            "" "Run: $RUN_URL" "" '```' "$table" '```' "" \
            "Si risolve con il bump Dependabot dell'immagine base; il controllo giornaliero riprova da solo.")
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi

      - name: SBOM (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      # Attestazioni firmate (Sigstore) registrate su GitHub, legate al digest.
      # Verifica: .github/scripts/verify-image.sh <tag>
      - name: Attestazione provenance
        id: att-prov
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Attestazione SBOM
        id: att-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Firma keyless del digest (non del tag, che è mobile).
      - name: Firma immagine (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Asset della GitHub Release (job github-release, solo sui tag): SBOM e
      # bundle Sigstore delle due attestazioni, verificabili offline.
      - name: Prepara asset release
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          PROV: ${{ steps.att-prov.outputs.bundle-path }}
          SBOM_ATT: ${{ steps.att-sbom.outputs.bundle-path }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp sbom.cdx.json "release-assets/valori-venali-$REF_NAME.sbom.cdx.json"
          cp "$PROV" "release-assets/valori-venali-$REF_NAME.provenance.sigstore.json"
          cp "$SBOM_ATT" "release-assets/valori-venali-$REF_NAME.sbom.sigstore.json"
          echo "$IMAGE@$DIGEST" > "release-assets/valori-venali-$REF_NAME.image-digest.txt"
          (cd release-assets && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-assets
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Trivy results
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # App + MariaDB avviate con il digest appena firmato: se fallisce nessun tag
  # si sposta e latest resta il precedente. Saltato (e con lui publish) se il
  # rebuild per CVE non ne corregge nessuna.
  smoke:
    needs: [ setup, build-push ]
    if: needs.build-push.outputs.publish != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      # Script da questo commit (i tag vecchi possono non averlo), dati
      # (initdb, compose) dalla sorgente dell'immagine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source }}
          persist-credentials: false
          path: src

      - name: Smoke test
        working-directory: src
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          docker pull -q "$IMAGE@$DIGEST"
          "$GITHUB_WORKSPACE/ci/.github/scripts/smoke-test.sh" "$IMAGE@$DIGEST"

      - name: Log app (se smoke test fallisce)
        if: failure()
        run: cat src/smoke-app.log || true

  # Solo ora l'immagine diventa raggiungibile per tag (indice copiato così
  # com'è, attestazioni comprese).
  publish:
    needs: [ setup, build-push, smoke ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      # Qui il login partirebbe subito dopo harden-runner, prima che le regole
      # di uscita siano attive: "connection refused" su ghcr.io (run 40759674408).
      # Negli altri job checkout/buildx danno il tempo; qui si aspetta esplicitamente.
      - name: Attendi rete verso ghcr.io
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ghcr.io/v2/ || true)
            [ "$code" = 401 ] || [ "$code" = 200 ] && { echo "ghcr.io raggiungibile ($code)"; exit 0; }
            echo "tentativo $i: $code"; sleep 5
          done
          echo "::error::ghcr.io non raggiungibile"; exit 1

      # Niente setup-buildx: imagetools lavora solo sul registry, basta il
      # buildx del runner (setup-buildx scaricherebbe BuildKit da Docker Hub).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica tag
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
          TAGS: ${{ needs.setup.outputs.tags }}
          VERSION: ${{ needs.setup.outputs.version }}
          REASON: ${{ needs.setup.outputs.reason }}
        run: |
          set -euo pipefail
          args=()
          IFS=, read -ra tags <<<"$TAGS"
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          [ "${#args[@]}" -gt 0 ] || { echo "::error::Nessun tag da pubblicare"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          {
            echo "### Pubblicato \`$VERSION\`"
            echo
            echo "\`$IMAGE@$DIGEST\` → ${TAGS//,/ }"
            echo
            echo "Motivo: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub Release del tag, solo dopo la pubblicazione su GHCR: note generate
  # dai PR, SBOM e bundle Sigstore (provenance SLSA + SBOM firmati) come asset.
  # Verifica offline di un asset: gh attestation verify --bundle <file.sigstore.json>
  github-release:
    needs: [ setup, build-push, publish ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            *.blob.core.windows.net:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: |
            CHANGELOG.md
            .github/scripts/release-notes.sh
          sparse-checkout-cone-mode: false

      # Note per gli utenti dal CHANGELOG in testa, elenco delle PR generato da
      # GitHub in coda (--generate-notes accoda alle note passate).
      - name: Note di rilascio
        working-directory: src
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/release-notes.sh "$REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Crea release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          TAGS: ${{ needs.setup.outputs.tags }}
        run: |
          set -euo pipefail
          # "Latest" su GitHub solo se il tag è anche :latest su GHCR (tag più alto)
          latest=false
          [[ ",$TAGS," == *":latest,"* ]] && latest=true
          if gh release view "$REF_NAME" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" -R "$REPO" --clobber release-assets/*
          else
            gh release create "$REF_NAME" -R "$REPO" --verify-tag --generate-notes \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --title "$REF_NAME" --latest="$latest" release-assets/*
          fi
