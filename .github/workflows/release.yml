name: Build & Push Container

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versione da pubblicare (es. v2.1.0)'
        required: false
        default: 'latest'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set lowercase image owner + version
        env:
          OWNER: ${{ github.repository_owner }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          OWNER_CLEAN=$(echo "$OWNER" | tr -d '"')
          IMAGE_OWNER=$(echo "$OWNER_CLEAN" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_OWNER=$IMAGE_OWNER" >> $GITHUB_ENV

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${DISPATCH_TAG:-latest}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_REVISION=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "APP_IS_TAG=true" >> $GITHUB_ENV
          echo "GITHUB_URL=https://github.com/${{ github.repository }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push immagine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.APP_REVISION }}
            APP_IS_TAG=${{ env.APP_IS_TAG }}
            GITHUB_URL=${{ env.GITHUB_URL }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ env.APP_VERSION }}
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ github.sha }}

      # Scan immagine pubblicata — report-only, risultati su tab Security.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: latest
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ env.APP_VERSION }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-image.sarif
