name: Sicurezza

# Controlli sul sorgente a ogni PR, in merge queue, su push su master e in un
# giro giornaliero (nuovi advisory su dipendenze invariate). I job sono
# required check del ruleset di master: anche l'auto-merge Dependabot li aspetta.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dipendenze aggiunte o aggiornate dalla PR con advisory high/critical
  # (npm, Action, immagini). Solo sulle PR: in coda e su push il job risulta
  # saltato, che per un required check vale verde.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Advisory npm sulle dipendenze di produzione (Bootstrap Italia e
  # transitive), lette dal lockfile senza installare nulla.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: npm audit (prod, HIGH+)
        run: npm audit --omit=dev --audit-level=high

  # CVE nel lockfile, segreti committati e misconfig (Dockerfile app e db).
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # Senza, con format sarif l'action ignora `severity` ed exit-code scatta su tutto.
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # SAST PHP (CodeQL non supporta PHP): regole p/php + p/security-audit dal
  # registry Semgrep. Bloccante su ogni risultato; i falsi positivi si
  # marcano nel codice con `// nosemgrep: <rule-id>` e la motivazione accanto.
  # Immagine fissata per digest in docker/semgrep/Dockerfile (Dependabot).
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep (PHP)
        run: |
          image=$(sed -n 's/^FROM //p' docker/semgrep/Dockerfile)
          docker run --rm -v "$PWD:/src" -w /src "$image"             semgrep scan --config p/php --config p/security-audit               --metrics=off --error --exclude vendor --exclude tests               --sarif-output=semgrep.sarif --text src

      # Il SARIF contiene anche i risultati marcati nosemgrep (suppressions
      # "inSource"), che code scanning ignora e aprirebbe come alert: via.
      - name: Togli dal SARIF i risultati soppressi
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' \
            semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
