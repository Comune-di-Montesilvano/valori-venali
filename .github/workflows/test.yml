name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'

      - name: Syntax check (Lint)
        run: |
          find src -name "*.php" -print0 | xargs -0 -n1 php -l

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Scan del Dockerfile/config — bloccante, gira anche sulle PR senza
      # bisogno di aver già buildato nulla.
      - name: Trivy config scan (Dockerfile)
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: latest # il binario Trivy pinnato di default da questa release dell'action (0.69.1) non installa
          scan-type: config
          scan-ref: docker/php/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Solo verifica che l'immagine si costruisca — nessun push, nessun tag
      # pubblico. Il publish reale vive in release.yml, solo su tag v*.
      - name: Build (test only, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          load: true
