name: Dependabot auto-merge

# Patch e minor: auto-merge (squash) appena passano i required check
# (PHP Lint + Docker Build Test con smoke test e Trivy).
# Major: nessun merge, la PR resta aperta come segnalazione + commento.
#
# L'auto-merge è abilitato col token della GitHub App, non con GITHUB_TOKEN:
# un merge fatto da GITHUB_TOKEN non genera eventi push, quindi
# dependabot-update-branches.yml non partirebbe e le altre PR resterebbero
# "behind" (master ha strict: true).
# Secret DEPS_APP_CLIENT_ID / DEPS_APP_PRIVATE_KEY: vanno anche nei
# secret *Dependabot*, i workflow lanciati da Dependabot non vedono quelli Actions.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Metadata Dependabot
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Token GitHub App
        id: app
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}

      - name: Auto-merge patch/minor
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Segnala major
        if: steps.meta.outputs.update-type == 'version-update:semver-major' && github.event.action == 'opened'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major update** (\`$DEPS\`): non mergiata in automatico, serve review manuale."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
