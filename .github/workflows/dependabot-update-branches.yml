name: Dependabot update branches

# master ha strict: true → dopo ogni merge le altre PR Dependabot con
# auto-merge attivo restano "behind" e Dependabot non le aggiorna da solo
# (rebasa solo sui conflitti). Qui ne aggiorno UNA alla volta (la più
# vecchia) col token della GitHub App: il push dell'app fa ripartire la CI
# (con GITHUB_TOKEN no), al merge parte un nuovo push su master → prossima PR.

on:
  push:
    branches: [ "master" ]
  # Paracadute se un giro si interrompe (es. CI fallita su una PR)
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-update-branches
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}

      - name: Aggiorna la PR Dependabot più vecchia rimasta indietro
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list -R "$REPO" --author app/dependabot --state open \
                 --json number,mergeStateStatus,autoMergeRequest \
                 --jq '[.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND")] | sort_by(.number) | .[0].number // empty')
          if [ -z "$PR" ]; then echo "Nessuna PR Dependabot indietro"; exit 0; fi
          echo "Aggiorno #$PR"
          gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" --silent
