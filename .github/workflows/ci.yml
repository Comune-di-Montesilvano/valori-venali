name: CI/CD - Valori Venali

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'

      - name: Syntax check (Lint)
        run: |
          find src -name "*.php" -print0 | xargs -0 -n1 php -l

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Scan del Dockerfile/config — bloccante, gira anche sulle PR senza
      # bisogno di aver già buildato/pushato nulla.
      - name: Trivy config scan (Dockerfile)
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: latest # il binario Trivy pinnato di default da questa release dell'action (0.69.1) non installa
          scan-type: config
          scan-ref: docker/php/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set lowercase image owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Remove any surrounding double quotes, then lowercase
          OWNER_CLEAN=$(echo "$OWNER" | tr -d '"')
          IMAGE_OWNER=$(echo "$OWNER_CLEAN" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_OWNER=$IMAGE_OWNER" >> $GITHUB_ENV

          # Determine version and revision (for links)
          # Su pull_request GITHUB_REF è "refs/pull/N/merge" — lo strip
          # refs/heads/ non matcha e lascia gli slash nel nome, tag Docker
          # invalido ("invalid reference format"). GITHUB_HEAD_REF (settata
          # solo su pull_request) dà il vero nome branch, sanificato di
          # eventuali "/" residui (branch tipo "feature/x").
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            REVISION=${GITHUB_REF#refs/tags/}
            IS_TAG="true"
            LATEST_TAG="ghcr.io/$IMAGE_OWNER/valori-venali:latest"
          elif [[ -n "$GITHUB_HEAD_REF" ]]; then
            BRANCH_NAME=$(echo "$GITHUB_HEAD_REF" | tr '/' '-')
            VERSION="${BRANCH_NAME}-$(echo $GITHUB_SHA | cut -c1-7)"
            REVISION=${GITHUB_SHA}
            IS_TAG="false"
            LATEST_TAG=""
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            VERSION="${BRANCH_NAME}-$(echo $GITHUB_SHA | cut -c1-7)"
            REVISION=${GITHUB_SHA}
            IS_TAG="false"
            if [[ "$BRANCH_NAME" == "master" ]]; then
              LATEST_TAG="ghcr.io/$IMAGE_OWNER/valori-venali:latest"
            else
              LATEST_TAG=""
            fi
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_REVISION=$REVISION" >> $GITHUB_ENV
          echo "APP_IS_TAG=$IS_TAG" >> $GITHUB_ENV
          echo "GITHUB_URL=https://github.com/${{ github.repository }}" >> $GITHUB_ENV
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        # Mai su pull_request: un token di una PR (anche interna) non deve
        # pubblicare immagini su GHCR — solo push reali a master/tag.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on real push events only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # build context is repository root so Dockerfile can COPY src/
          context: .
          file: docker/php/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.APP_REVISION }}
            APP_IS_TAG=${{ env.APP_IS_TAG }}
            GITHUB_URL=${{ env.GITHUB_URL }}
          tags: |
            ${{ env.LATEST_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ env.APP_VERSION }}
            ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ github.sha }}

      # Scan dell'immagine pubblicata — solo sui push reali (l'immagine da PR
      # resta locale via `load`, non c'è nulla da scansionare nel registry).
      - name: Trivy image scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          version: latest
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/valori-venali:${{ env.APP_VERSION }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image.sarif
