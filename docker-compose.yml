# Immagine dell'app in un punto solo: la usano app e verify-image.
x-app-image: &app_image ghcr.io/comune-di-montesilvano/valori-venali:latest

services:

  # Verifica della firma cosign dell'immagine app prima di avviarla (opt-in:
  # VERIFY_IMAGES=true nel .env / nelle variabili dello stack Portainer).
  # Firma valida solo se fatta da release.yml di questo repo (tag v* o rebuild
  # da master); se manca o non è valida l'app NON parte. Spento = esce subito
  # con successo. Stessa verifica di .github/scripts/verify-image.sh, senza le
  # attestazioni gh. Serve accesso in uscita a ghcr.io e a Sigstore.
  verify-image:
    # Variante -dev: contiene una shell (busybox) per il controllo opt-in.
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4-dev@sha256:8af1a2cf9fba903fdfc6bdafdc25f7b13ef34ad722095543ea787fb96f7240c1
    container_name: valori_venali_verify
    restart: "no"
    environment:
      VERIFY_IMAGES: ${VERIFY_IMAGES:-false}
      IMAGE: *app_image
      IDENTITY: '^https://github.com/Comune-di-Montesilvano/valori-venali/\.github/workflows/release\.yml@refs/(tags/v.*|heads/master)$$'
      HOME: /tmp
    entrypoint: [ "/busybox/sh", "-c" ]
    command:
      - |
        if [ "$$VERIFY_IMAGES" != "true" ]; then
          echo "verify-image: VERIFY_IMAGES non attivo, verifica saltata"; exit 0
        fi
        cosign verify "$$IMAGE" \
          --certificate-identity-regexp "$$IDENTITY" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          > /dev/null && echo "verify-image: firma valida per $$IMAGE"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ ALL ]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - valori_net

  db:
    # Digest fissato, aggiornato da Dependabot (docker-compose)
    image: mariadb:11@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    container_name: valori_venali_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - valori_net
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Privilegi minimi: l'entrypoint parte da root e passa a mysql, servono
    # solo le capability per chown dei dati e cambio utente.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID ]
    read_only: true
    tmpfs:
      - /run/mysqld
      - /tmp

  app:
    # Production: use the prebuilt image from GHCR by default
    image: *app_image
    container_name: valori_venali_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      verify-image:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS:?DB_PASS obbligatoria}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_SECRET: ${APP_SECRET:?APP_SECRET obbligatoria (min 32 caratteri)}
      APP_ADMIN_USER: ${APP_ADMIN_USER}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS}
      COMUNE_NOME: ${COMUNE_NOME}
      COMUNE_PROVINCIA: ${COMUNE_PROVINCIA}
    volumes:
      # Persistent uploads (separate volume)
      - app_uploads:/var/www/html/uploads
    # Filesystem in sola lettura: scritture solo su uploads (volume) e tmpfs.
    # Apache su 80 anche da www-data grazie al sysctl (default Docker >= 20.10).
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ ALL ]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - valori_net

volumes:
  db_data:
    driver: local
  app_uploads:
    driver: local


networks:
  valori_net:
    driver: bridge
